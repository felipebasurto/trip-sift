<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img">
  <title>viajante — local flight and hotel search</title>
  <desc>Night route board with great-circle flights, the viajante wordmark, and a local CLI printing a JFK–NRT sweep and a Tokyo hotel shortlist. No API keys. Quotes in EUR.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#141C24"/>
      <stop offset="0.45" stop-color="#0C1218"/>
      <stop offset="1" stop-color="#080B0F"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0C1218" stop-opacity="0.97"/>
      <stop offset="0.38" stop-color="#0C1218" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#0C1218" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E06A3A"/>
      <stop offset="1" stop-color="#E8C27A"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B252E"/>
      <stop offset="1" stop-color="#121920"/>
    </linearGradient>
    <pattern id="grid" width="80" height="48" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V48" fill="none" stroke="#1E2A33" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#sky)"/>
  <rect width="1200" height="520" rx="28" fill="url(#grid)" opacity="0.45"/>
  <rect x="1.5" y="1.5" width="1197" height="517" rx="26.5" fill="none" stroke="#2C3944" stroke-width="1.5"/>

  <g fill="none" stroke-linecap="round">
    <path d="M86 268C170 198 300 168 400 196" stroke="#E06A3A" stroke-opacity="0.28" stroke-width="1.8"/>
    <path d="M160 236C280 140 420 128 520 168" stroke="#E06A3A" stroke-opacity="0.34" stroke-width="2"/>
    <path d="M160 236C250 300 300 360 332 392" stroke="#3D9B8F" stroke-opacity="0.28" stroke-width="1.6"/>
    <path d="M400 196C430 250 448 330 456 392" stroke="#E8C27A" stroke-opacity="0.2" stroke-width="1.4" stroke-dasharray="4 9"/>
    <path d="M86 268C70 250 60 240 48 236" stroke="#E8C27A" stroke-opacity="0.18" stroke-width="1.3"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#9AA6AE">
    <circle cx="48" cy="236" r="3.2" fill="#E8C27A"/><text x="58" y="232">LAX</text>
    <circle cx="160" cy="236" r="4.2" fill="#E06A3A"/><text x="172" y="232">JFK</text>
    <circle cx="332" cy="392" r="3.2" fill="#3D9B8F"/><text x="342" y="406">GRU</text>
    <circle cx="400" cy="196" r="4.2" fill="#E06A3A"/><text x="412" y="192">LHR</text>
    <circle cx="456" cy="392" r="3.2" fill="#E8C27A"/><text x="466" y="406">JNB</text>
    <circle cx="520" cy="168" r="3.6" fill="#E06A3A"/><text x="532" y="164">NRT</text>
  </g>

  <rect width="600" height="520" fill="url(#fade)"/>

  <text x="52" y="72" fill="#E06A3A" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="4.4">LOCAL · NO KEYS · NO ACCOUNT</text>
  <text x="46" y="168" fill="#F6F0E6" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="84" font-weight="800" letter-spacing="-2.8">viajante</text>
  <rect x="52" y="186" width="120" height="3" rx="1.5" fill="url(#ember)"/>
  <text x="52" y="230" fill="#D5DDE2" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="550">Shortlist any IATA pair. Stays too.</text>
  <text x="52" y="258" fill="#8B979F" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15">Your machine. Owned parsers. EUR so a New York fare and a Tokyo fare compare.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.4">
    <rect x="52" y="288" width="92" height="30" rx="15" fill="#12201E" stroke="#3D9B8F" stroke-width="1.3"/>
    <text x="98" y="308" fill="#E8F4F1" text-anchor="middle">SWEEP</text>
    <rect x="152" y="288" width="96" height="30" rx="15" fill="#241812" stroke="#E06A3A" stroke-width="1.3"/>
    <text x="200" y="308" fill="#F6EDE6" text-anchor="middle">DETAIL</text>
    <rect x="256" y="288" width="74" height="30" rx="15" fill="#221C12" stroke="#E8C27A" stroke-width="1.3"/>
    <text x="293" y="308" fill="#F6F0E6" text-anchor="middle">MCP</text>
  </g>

  <g>
    <rect x="628" y="48" width="524" height="424" rx="18" fill="url(#glass)" stroke="#3A4852" stroke-width="1.2"/>
    <circle cx="656" cy="74" r="5.5" fill="#E06A3A"/>
    <circle cx="676" cy="74" r="5.5" fill="#E8C27A"/>
    <circle cx="696" cy="74" r="5.5" fill="#3D9B8F"/>
    <text x="720" y="79" fill="#8B979F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5">viajante · localhost</text>

    <text x="656" y="122" fill="#3D9B8F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">$</text>
    <text x="674" y="122" fill="#F6F0E6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">viajante flights JFK-NRT:2026-10-12 --fetch sweep</text>

    <text x="656" y="156" fill="#7D8A92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">JFK → NRT  2026-10-12  ·  sweep  799 ms  ·  quotes EUR</text>

    <text x="656" y="192" fill="#E8C27A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">588 €</text>
    <text x="724" y="192" fill="#D5DDE2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">14 hr 05 min  1 stop  16:30 → 06:35  JAL</text>
    <text x="656" y="220" fill="#E8C27A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">612 €</text>
    <text x="724" y="220" fill="#D5DDE2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">13 hr 40 min  1 stop  11:15 → 22:55  ANA</text>
    <text x="656" y="248" fill="#9AA6AE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">441 €</text>
    <text x="724" y="248" fill="#9AA6AE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">19 hr 20 min  2 stops 10:05 → 21:25  CZ</text>

    <path d="M656 276H1108" stroke="#2C3944" stroke-width="1"/>

    <text x="656" y="312" fill="#3D9B8F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">$</text>
    <text x="674" y="312" fill="#F6F0E6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">viajante hotels Tokyo 2026-10-12 2026-10-16</text>
    <text x="656" y="336" fill="#7D8A92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">--source google  ·  4 nights  ·  ratings 0–5</text>

    <text x="656" y="372" fill="#E8C27A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">312 €</text>
    <text x="724" y="372" fill="#D5DDE2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">total stay  4.2  Hotel Kanda        Chiyoda</text>
    <text x="656" y="400" fill="#E8C27A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">401 €</text>
    <text x="724" y="400" fill="#D5DDE2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">total stay  4.6  Shimokitazawa House</text>

    <text x="656" y="440" fill="#66727A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">raw card text kept beside every number  ·  verify before booking</text>
  </g>
</svg>
