<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title>HTTP or Chromium</title>
  <desc>You or an agent pass a query. The CLI validates it. Flights sweep and Google Hotels use HTTP with no pause. Flight detail and Booking.com use local Chromium and sleep 4.5 to 6 seconds. Results are typed EUR. Cookies stay in the local state directory.</desc>
  <rect x="1" y="1" width="1198" height="298" rx="12" fill="#F6F0E4" stroke="#E6DCC9" stroke-width="2"/>

  <text x="56" y="52" fill="#172A33" font-size="16" font-weight="700">you or agent</text>
  <path d="M186 46H238" fill="none" stroke="#D75A2B" stroke-width="3" stroke-linecap="round"/>
  <path d="M244 46l-10 -6v12z" fill="#D75A2B"/>
  <text x="260" y="52" fill="#172A33" font-size="16" font-weight="700">CLI validates</text>
  <path d="M408 46H460" fill="none" stroke="#D75A2B" stroke-width="3" stroke-linecap="round"/>
  <path d="M466 46l-10 -6v12z" fill="#D75A2B"/>
  <text x="482" y="52" fill="#172A33" font-size="16" font-weight="700">typed EUR</text>

  <path d="M56 76H1144" stroke="#E6DCC9" stroke-width="1.5"/>

  <text x="280" y="112" fill="#52636B" font-size="14">HTTP · 0 s</text>
  <text x="720" y="112" fill="#52636B" font-size="14">Chromium · 4.5-6 s</text>
  <path d="M56 124H1144" stroke="#E6DCC9" stroke-width="1"/>

  <text x="56" y="172" fill="#52636B" font-size="14">Flights</text>
  <text x="280" y="168" fill="#172A33" font-size="22" font-weight="700">sweep</text>
  <text x="280" y="192" fill="#52636B" font-size="15">shopping RPC</text>
  <text x="720" y="168" fill="#172A33" font-size="22" font-weight="700">detail</text>
  <text x="720" y="192" fill="#52636B" font-size="15">full cards</text>

  <path d="M56 216H1144" stroke="#E6DCC9" stroke-width="1"/>

  <text x="56" y="252" fill="#52636B" font-size="14">Hotels</text>
  <text x="280" y="248" fill="#172A33" font-size="22" font-weight="700">Google Hotels</text>
  <text x="280" y="272" fill="#52636B" font-size="15">stay-total shortlist</text>
  <text x="720" y="248" fill="#172A33" font-size="22" font-weight="700">Booking.com</text>
  <text x="720" y="272" fill="#52636B" font-size="15">card evidence</text>
</svg>
