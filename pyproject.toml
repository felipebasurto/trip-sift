[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trip-sift"
version = "0.1.0"
description = "Local Google Flights and Booking.com search via Playwright (EUR; English flight rendering, Spanish hotel parsing)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "trip-sift contributors" }]
dependencies = [
    "playwright==1.60.0",
    "selectolax>=0.3.25",
]

[project.urls]
Homepage = "https://github.com/felipebasurto/trip-sift"
Repository = "https://github.com/felipebasurto/trip-sift"
Issues = "https://github.com/felipebasurto/trip-sift/issues"

[project.scripts]
trip-sift = "trip_sift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trip_sift = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "ruff==0.15.12",
]
