[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "viajante"
version = "0.1.0"
description = "Local Google Flights and Booking.com search via Playwright (EUR; English flight rendering, Spanish hotel parsing)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "viajante contributors" }]
dependencies = [
    "playwright==1.60.0",
    "selectolax>=0.3.25",
]

[project.urls]
Homepage = "https://github.com/felipebasurto/viajante"
Repository = "https://github.com/felipebasurto/viajante"
Issues = "https://github.com/felipebasurto/viajante/issues"

[project.scripts]
viajante = "viajante.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
viajante = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "ruff==0.15.12",
]
